# ci.yml -- the checks that run on every pull request and every push to main.
#
# Plain-English summary:
#   * Each job below checks one safety net.
#   * The LAST job, "required", is the only one you mark as a required check
#     in your branch rules (see docs/protect-main.md). It waits for all the
#     others and passes only if every one of them truly succeeded.
#
# Security defaults used everywhere in this file:
#   * The token GitHub gives each job can only READ the repo (least privilege).
#   * Every job has a time limit, so a stuck job cannot run (and bill) forever.
#   * Third-party actions are pinned to an exact commit SHA, with the version
#     in a comment. Dependabot (.github/dependabot.yml) proposes updates.

name: ci

on:
  pull_request:
  push:
    branches: [main]

# Default for the whole workflow: no permissions at all. Each job asks for
# the minimum it needs below.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  guard-selftest:
    name: Guard self-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Guard self-test
        run: node .claude/guard/selftest.mjs

  skills-lint:
    name: Skills lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Skills lint
        run: node scripts/lint-skills.mjs

  launch-check-selftest:
    name: Launch check self-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Launch check self-test
        run: node scripts/launch-check.mjs --selftest

  workflow-lint:
    name: Workflow lint (permissions + timeouts)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Workflow lint (permissions + timeouts)
        run: |
          node scripts/check-workflows.mjs --selftest
          node scripts/check-workflows.mjs

  vet-tool-selftest:
    name: Vet-tool self-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Vet-tool self-test
        run: node scripts/vet-tool.mjs --selftest

  handoff-selftest:
    name: Handoff self-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Handoff self-test
        run: node scripts/handoff.mjs --selftest

  # The comparison that .github/workflows/drift-check.yml relies on. Its
  # fixtures are the recorded output of the pinned Supabase CLI, and the cases
  # cover a missing migration, an extra migration, a missing function and
  # identical lists -- so the thing that decides whether production has drifted
  # is checked on every pull request, rather than being first exercised on the
  # morning it matters. See evidence/build-it-15-part-4.md.
  drift-check-selftest:
    name: Drift-check self-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Drift-check self-test
        run: node scripts/drift-check.mjs --selftest

  # The five pure-function check scripts: issues #87, #102, #157 and #173. None
  # touches the network, a database or an account -- each imports a real module
  # out of web/src/lib and calls it, so there is no cost argument for leaving
  # them out.
  #
  # The third, sentry-scrub-check, arrived with Build it 18 and is the one with
  # the least recoverable failure of the three: it checks the function that
  # decides what an error report may contain before it is sent to Sentry, and a
  # value sent to an outside company cannot be taken back by a later commit.
  #
  # THE FOURTH AND FIFTH ARRIVED WITH BUILD IT 19 (issue #173), and the issue asks
  # for both of them by name:
  #
  #   screen-state-check    the one function that decides which look a screen shows
  #                         -- loading, error, empty or data. The rule it holds is
  #                         that a FAILED LOAD IS NEVER AN EMPTY LIST, which is
  #                         easy to lose because `data ?? []` makes the two
  #                         identical at the screen. The issue asks that the check
  #                         be "seen to fail when a failed load is treated as
  #                         empty": that run is in
  #                         evidence/build-it-19-honest-screens.md.
  #   friendly-words-check  that every role and every invitation status the
  #                         DATABASE allows has a word a person can read. It reads
  #                         the two migrations and compares the mapping with what
  #                         the check constraint and the view actually permit, so a
  #                         migration adding a value turns it red rather than
  #                         leaving a screen unable to draw it.
  #
  # friendly-words-check reads two files under supabase/migrations. That is the only
  # thing either of them reads, and neither touches a key, a .env file or a network.
  #
  # Node reads those .ts modules directly and strips the types as it loads
  # them. That needs no flag here: type stripping is enabled by default from
  # Node v23.6.0 and v22.18.0 (nodejs.org/api/typescript.html, the History
  # table), and the "22" below resolves to the newest 22.x. The version is
  # printed into the log so the run says which Node actually ran, rather than
  # leaving the next person to work it out.
  pure-checks:
    # The display name carries both script names on purpose: this is the string
    # that shows in the checks list on a pull request, and issue #87 asks that a
    # red check name tasks-filter-check rather than leave you opening logs.
    name: Pure-function checks (tasks-filter-check, password-reset-check, sentry-scrub-check, screen-state-check, friendly-words-check, approved-model-check, auth-screens-check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    # A FLOOR, not an equality. Adding checks to any of the scripts must not
    # fail this job, but a run that checked fewer things than it used to has
    # lost coverage, and a run that checked nothing is not a pass (AGENTS.md
    # rule 8). All six numbers were counted from the scripts' own output.
    env:
      EXPECTED_TASKS_FILTER_CHECKS: "47"
      EXPECTED_PASSWORD_RESET_CHECKS: "84"
      # 95 -> 119 WITH BUILD IT 23 PART 2 (issue #242). Twenty-four checks over
      # one new rule: a stored file's path. docs/plan.md puts a file name on
      # Sentry's "must never be sent" list, and says in the same breath why a
      # scrub cannot normally catch one -- "a pattern scrub cannot recognise free
      # text that no known phrase introduces". A NAME has no shape; the PATH it
      # lives at does, because every object in the attachments bucket is at
      # `<task id>/<file name>`. So the rule matches the construct, keeps the
      # task id -- which is what makes a report useful -- and takes the half
      # somebody's phone wrote.
      #
      # Three of the twenty-four exist because the first version of the rule was
      # WRONG and these checks caught it: it matched its own output, growing a
      # bracket per pass, so scrubText stopped being idempotent -- and the same
      # string really does reach that function twice, once as an exception value
      # and once inside the message built from it. Two more record a deliberate
      # over-reach rather than hiding it: a path in a bare sentence takes the rest
      # of the line, because the alternative is a rule that stops at a space and
      # leaks every file name with a space in it.
      #
      # Seen to fail: with the rule removed, sixteen of them go red.
      EXPECTED_SENTRY_SCRUB_CHECKS: "119"
      # 110 -> 158 with Build it 21 (issue #211). Forty-eight checks over
      # web/src/lib/consent.ts and the two files that read the setting: the three
      # states and every shape of nothing, "Saved" only after a read-back, the
      # settings sentence table, what the consent screen promises in its own
      # words, and that no screen selects either new column -- which after
      # 20261007204900_ai_suggestions_consent.sql is refused for everybody, the
      # person included. Counted from the script's own output.
      #
      # 158 -> 182 WITH BUILD IT 22 (issue #221). Twenty-four checks over today's
      # limit, and the thing they are about is that THERE IS ONE SENTENCE: it lives in
      # three places that must agree character for character -- the function's
      # supabase/functions/_shared/limits.ts, web/src/lib/suggestions.ts for My tasks,
      # and web/src/lib/teams.ts for My teams -- and each is a deliberate copy, because
      # the deployed function is a different program from the one in this branch until
      # somebody deploys. This is the only thing that would notice a drift.
      #
      # The rest: that both screens match on the CODE the function actually sends (the
      # pair that would otherwise fail silently -- a screen reading a code that is never
      # sent draws the fixed sentence and nobody ever sees the limit's words); that
      # neither screen names a number, so limits.ts stays the one place; that the limit
      # is told apart BEFORE the thirteen plumbing failures, because "please try again"
      # is the one piece of advice that is certainly wrong here; and that the code is
      # matched as an exact word, so a near-miss cannot become a refusal.
      #
      # It is also the first coverage web/src/lib/suggestions.ts has had from this
      # script: before this change nothing here read that module at all.
      # 182 -> 277 WITH BUILD IT 23 PART 2 (issue #242), and 277 -> 286 with its
      # HEIC follow-up, which the paragraph after this one covers. Ninety-five over
      # web/src/lib/attachments.ts and the three files that use it, and the first
      # group of them is the one worth having:
      #
      # THE NUMBERS AND THE SIX TYPES ARE READ OUT OF THE MIGRATION'S OWN SQL and
      # compared with the module's. The database is the control -- the bucket row
      # holds the 5 MB and the types, and public.attachments_may_add() counts the
      # three-per-task and the 100 MB -- so every number on the screen side is a
      # COPY, kept only so a person reads "Each file can be up to 5 MB" instead of
      # `EntityTooLarge`. A drifted copy means a screen promising a limit the
      # database does not keep, and nothing else would notice.
      #
      # The rest: which content type a file's name gets (`.heic` -> image/heic is
      # the line the whole browser upload exists for, after the owner's staging
      # run of 9 Oct showed a .heic name refused without one); what a name is
      # rebuilt as, so it cannot add a path segment and move a file to another
      # task; which of eleven sentences a refusal gets, from a status and a code
      # that are never drawn; that NOT ONE sentence carries a word Supabase chose,
      # a status, a code or a company; that the two sentences with a number in
      # them interpolate it from the constant; and that no service-role key or
      # signed upload URL appears in the upload path, which is the whole of issue
      # #240 in one check.
      #
      # Two of the ninety-five exist because they caught themselves being wrong:
      # a search for the wildcard found it in the migration's own PROSE explaining
      # why it is not used, so the check now slices the bucket's array out of the
      # statement -- only the statement decides anything.
      #
      # And two are about an ORDER rather than a value: deleting a task reads whose
      # task it is BEFORE it touches storage. Clearing first for everybody is safe
      # and says the wrong thing -- a team mate would be told "its files could not
      # be removed first", which is true and conceals that the task was never
      # theirs to delete.
      #
      # 277 -> 286 WITH THE HEIC FOLLOW-UP of 9 Oct 2026 (issue #246). The owner
      # tried a HEIC photograph through the app, from a Windows PC, and it failed;
      # the cause was not found and the owner decided not to pursue it. So the app
      # stopped offering `image/heic` -- and the BUCKET still permits it, because
      # narrowing a bucket means a migration against something nobody has shown to
      # be at fault.
      #
      # So nine checks, and the two shapes of them are both about not lying:
      #
      #   * THE TWO LISTS DIFFER BY ONE TYPE, ASSERTED BY NAME. The app's list must
      #     be a subset of the bucket's, and the one type on the bucket's side must
      #     be `image/heic`. A subset check alone would pass just as happily if
      #     somebody dropped PNG; an equality check would fail the moment the app
      #     is honest about something the bucket allows. The named difference is
      #     what is actually true, so that is what is written down -- and it is the
      #     gate a later "turn HEIC back on" has to come through.
      #   * AND NO SENTENCE NAMES A TYPE THE APP DOES NOT ACCEPT, derived from
      #     ACCEPTED_TYPES rather than written out. This is the one that mattered:
      #     `FILE_WRONG_TYPE` read "JPEG, PNG, WebP, GIF, HEIC or PDF", so with
      #     HEIC off the list the screen would have named a HEIC photograph as
      #     accepted IN THE VERY MESSAGE REFUSING ONE.
      #
      # Written before the code and seen to fail: eight of the nine were red
      # against the unchanged app, each for its own reason.
      # evidence/build-it-23-attachments-screen.md section 9.4 has the run.
      #
      # 286 -> 290 ON 2026-10-12, Build it 25 part 2b, and the four are all about
      # ONE DEPARTURE FROM docs/plan.md: the third daily limit, 30 uploads, lives
      # in a MIGRATION rather than in supabase/functions/_shared/limits.ts,
      # because a PostgreSQL trigger cannot read a TypeScript file. The owner
      # agreed to that on 2026-10-12.
      #
      # So the four assert the departure rather than trusting it: that `uploads`
      # is NOT a key in limits.ts, that the 30 is in the migration exactly once as
      # a named constant, that the migration's refusal sentence is the SAME
      # characters as the function's DAILY_LIMIT_MESSAGE -- compared across a
      # language boundary, so the SQL's doubled apostrophe is undone rather than
      # spelled twice -- and a CONTROL that the same comparison would notice a
      # different sentence.
      #
      # A sentence in two languages is the shape this repository keeps recording
      # as a thing that drifts, and this is the first one that spans SQL and
      # TypeScript.
      #
      # 290 -> 297 ON 2026-10-12, Build it 25 part 2's screens. Seven, and they
      # are all drift guards between a screen and a migration: the files panel's
      # daily-limit sentence against the function's, that it names no number, the
      # SQLSTATE the screen matches against the one the trigger raises, the task
      # cap against `c_tasks_per_person`, the two constraint names against the two
      # `add constraint` statements, and the number 30 in the migration that was
      # replaced as well as the one that replaced it.
      #
      # AND ONE EXISTING CHECK WAS NARROWED, which is the rule 20 line and has its
      # own paragraph beside it in the script: "the two file actions read a CODE
      # and never a message" went red because the owner asked for the behaviour it
      # forbade -- the daily limit arrives as a SQLSTATE inside a message string,
      # and PostgreSQL puts a constraint's name nowhere else. It now asserts the
      # thing it was protecting instead: every message read goes to one of this
      # project's own readers, and NO message reaches a redirect, a banner or a
      # template. Agreed by the owner, 12 October 2026.
      EXPECTED_SCREEN_STATE_CHECKS: "297"
      EXPECTED_FRIENDLY_WORDS_CHECKS: "45"
      # The sixth arrived with Build it 20 (issue #183). Six PASS lines: the
      # 39 logic cases behaving as described, the approved file existing and
      # parsing, the approved file being usable (one entry marked for use, each
      # with the date it was approved), the count of text files read, what the
      # evidence/ exemption let through, and no file naming an unapproved model.
      #
      # IT RUNS ITS OWN LOGIC CASES ON EVERY RUN, not only with --selftest, so
      # this one number counts both "the scan is clean" and "the scan could
      # still have caught something". That is deliberate: the other five
      # scripts here have no such half, and this check's whole value rests on
      # the pattern it uses to recognise a model name still telling
      # claude-code-action from a model id.
      EXPECTED_APPROVED_MODEL_CHECKS: "6"
      # THE SEVENTH ARRIVED WITH BUILD IT 25 PART 1 (issue #284), and the thing
      # it exists for is a sentence that was WRONG on production on 11 October
      # 2026: the owner followed a real reset link, the form loaded, and saving
      # the password was refused with HTTP 422 and the code `same_password` --
      # and the screen said "That link didn't work." Nothing in this repository
      # would have noticed, because the action sent every answer Supabase could
      # give down one path.
      #
      # So the checks are over three new modules, all three import-free so a
      # plain `node` run can load them: web/src/lib/auth-messages.ts (one plain
      # sentence per refusal, chosen from the error CODE and never from the
      # service's text), web/src/lib/email-links.ts (a link that works in any
      # browser and that a mail scanner cannot spend), and
      # web/src/lib/turnstile.ts (the anti-robot check's four states).
      #
      # The groups worth naming, because each one is a way the thing could
      # quietly stop being true:
      #
      #   * ONLY A LINK THAT IS REALLY DEAD SAYS THE LINK DID NOT WORK. Six
      #     answers that mean the recovery session is gone must take the
      #     dead-link path, and four that do not -- including the two the owner
      #     saw -- must not. There is a CONTROL that reproduces the old
      #     behaviour and requires it NOT to be what the code does.
      #   * NO SENTENCE NAMES A COMPANY, A STATUS OR A CODE, derived from the
      #     table rather than written out, with a control that finds those words
      #     when they are there.
      #   * AN ADDRESS THAT ALREADY HAS AN ACCOUNT IS NOT TOLD SO. `email_exists`
      #     is deliberately not one of the six sign-up refusals, because telling
      #     somebody is how a list of addresses gets sorted into accounts and
      #     not-accounts.
      #   * THE CONFIRM PAGE CALLS SUPABASE NOWHERE -- no client, no verifyOtp,
      #     no cookie -- and the action behind it checks the button BEFORE it
      #     spends the token. That pair is the whole of "a scanner's GET or HEAD
      #     spends nothing", and /auth/reset is the control, because it does call
      #     Supabase and still serves links sent before the change.
      #   * THE TWO EMAIL TEMPLATES ARE COMPARED WITH THE DOCUMENT THE OWNER
      #     FOLLOWS. The `href` lines are exported from the module and
      #     docs/rate-limits.md must contain both verbatim, so an instruction
      #     pointing at a path this app no longer serves turns a pull request red
      #     rather than being found by a volunteer.
      #   * THREE STRINGS SPELLED IN TWO MODULES ARE COMPARED. The dead-link
      #     path, the new-password screen's path and the reset marker's name are
      #     each written twice, because both modules have to stay import-free;
      #     this is the only thing that would notice a drift.
      #   * AND IT NEVER SUBMITS WITHOUT A TOKEN: only "off" and "solved" may
      #     post, with a control that lists what `maySubmit` lets through.
      #
      # Written before the code and seen to fail: seven of them were red against
      # the half-finished change, including the one that found this script's own
      # comment stripper eating the second half of every URL in the file it was
      # asked to find a URL in. evidence/build-it-25-sign-in-screens.md has the
      # runs.
      EXPECTED_AUTH_SCREENS_CHECKS: "90"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Which Node ran these
        run: node --version
      - name: Run all seven scripts, and count what each one actually checked
        run: |
          set -euo pipefail

          # Run one check script, show every line it prints, then count the
          # PASS lines. The count is the whole point: a script that compiled,
          # exited 0 and checked nothing would otherwise be a green tick.
          run_and_count () {
            label="$1"; script="$2"; expected="$3"
            log="$RUNNER_TEMP/$label.log"
            echo "--- $label: node $script"
            node "$script" | tee "$log"
            count=$(grep -c '^PASS ' "$log" || true)
            : "${count:=0}"
            echo "$label: counted $count PASS lines; at least $expected expected."
            if [ "$count" -lt "$expected" ]; then
              echo "::error::$label ran $count checks, fewer than the $expected expected. Either the script lost checks or it never ran them. Restore them, or lower the expected number on purpose and say why."
              exit 1
            fi
          }

          # Each label is the script's own file name, so the banner and the
          # error line both carry the name somebody would search for. Issue #87
          # asks for exactly that: "the failing check names tasks-filter-check".
          run_and_count tasks-filter-check   scripts/tasks-filter-check.mjs   "$EXPECTED_TASKS_FILTER_CHECKS"
          run_and_count password-reset-check scripts/password-reset-check.mjs "$EXPECTED_PASSWORD_RESET_CHECKS"
          run_and_count sentry-scrub-check   scripts/sentry-scrub-check.mjs   "$EXPECTED_SENTRY_SCRUB_CHECKS"
          run_and_count screen-state-check   scripts/screen-state-check.mjs   "$EXPECTED_SCREEN_STATE_CHECKS"
          run_and_count friendly-words-check scripts/friendly-words-check.mjs "$EXPECTED_FRIENDLY_WORDS_CHECKS"
          run_and_count approved-model-check scripts/approved-model-check.mjs "$EXPECTED_APPROVED_MODEL_CHECKS"
          run_and_count auth-screens-check  scripts/auth-screens-check.mjs   "$EXPECTED_AUTH_SCREENS_CHECKS"

  # The --selftest of the five staging scripts that have one: issues #114, #136,
  # #167, #183 and the coach's review of PR #241. A selftest here is the thing that
  # makes a green staging run mean anything -- it feeds every judgement in the
  # script an answer from a world where the door is open and requires each one to
  # come out FAIL. None of them sends a request, reads web/.env.local or uses an
  # account, so all five run here with no secret of any kind.
  #
  # THE THIRD ARRIVED WITH ISSUE #167. build-it-18-invitation-status-checks.mjs was
  # added for Build it 18 part 2b and this job named only the other two by path, so
  # its 57 cases ran nowhere and could not fail a pull request. Unlike the Deno job
  # above there is no folder to point at: each script needs its own expected count,
  # so each needs its own line.
  #
  # The staging runs themselves are NOT here and cannot be: they need the
  # staging URL and the three test accounts. Those belong to Build it 17.
  # THE SIXTH ARRIVED WITH BUILD IT 25 PART 1 (issue #284):
  # scripts/staging/build-it-25-captcha-checks.mjs. Its own expected count and
  # the reason for it are beside the others in the env block below.
  # THE NINTH ARRIVED WITH BUILD IT 26 PART 1 (#302), and it is the first line in
  # this job the OWNER ASKED FOR rather than one added with the script:
  # scripts/staging/build-it-26-legal-pages-checks.mjs went in with no line here,
  # its absence was filed as #302 because rule 5 reserves this file to the owner,
  # and the owner asked for it on 2026-10-13. The gap it closes is the one #167
  # and #102 both record — a check that exists and runs nowhere.
  staging-script-selftests:
    name: Staging script self-tests (can these checks fail?)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    # Counted from each script's own output; a floor, as above.
    env:
      EXPECTED_BUILD_IT_16_CASES: "39"
      EXPECTED_SUSPEND_CASES: "40"
      EXPECTED_INVITATION_STATUS_CASES: "57"
      # THE FOURTH ARRIVED WITH BUILD IT 20 (issue #183), which asks for it here
      # by name. build-it-20-ai-checks.mjs is the script the owner runs before
      # and after deploying suggest-subtasks to staging, and its 64 cases are
      # what make a green run from it mean anything: they feed every judgement
      # an answer from a world where the function is not deployed, or sends six
      # suggestions, or sends one carrying a link, or claims the subtasks were
      # added, or gives a stranger a different 404 from a made-up id -- and
      # require each one to come out FAIL.
      #
      # It is the only script here whose staging run COSTS MONEY (at most three
      # metered requests to Anthropic). This job does not make any: --selftest
      # returns before a setting is read, so there is no key, no account and no
      # network involved, the same as the three beside it.
      #
      # 64 -> 65 with the coach's review of PR #190: one case for the new
      # `model_unavailable` code, which this script's own copy of the code list has
      # to know about -- it fails a 503 carrying a code it does not recognise, so a
      # code added to the function and not here would turn a correct deployed
      # function red.
      #
      # 65 -> 69 after the owner's staging run of 7 October 2026 reported a FAIL
      # that was the script's own fault: it scrubbed a response before parsing it,
      # so the title read back arrived as the placeholder TASK_TITLE and could
      # never equal the string it stands for. Four cases, which go through the
      # script's real reading path rather than past it -- the only kind that could
      # have caught it. Two of the four FAILED before the order was fixed.
      #
      # 69 -> 75 after the same day's deployed runs, where the signed-out check
      # FAILED and the EXPECTATION was what the owner agreed was wrong (rule 20):
      # a POST carrying the publishable key and no Authorization header is refused
      # 401 UNUSABLE_CREDENTIAL by @supabase/server inside the function, not by the
      # platform, and verify_jwt is true on that function all the same. The one
      # check became two -- no credentials at all, where the platform's own refusal
      # is expected, and the apikey alone, where the library's is -- and nine cases
      # replace three. Five of the nine FAILED before the split, the first of them
      # the real staging answer being called a fault.
      #
      # 75 -> 110 with Build it 21 (issue #211), which extends this script with the
      # consent setting: where it stands, switching it, the ask being refused with
      # the setting off, nobody switching or reading anybody else's, and the setting
      # being left as the run found it. Thirty-five cases, and the one that matters
      # feeds judgeRefusedWhenOff the answer a function with NO consent check gives
      # -- 200 with suggestions -- and requires all four parts to come out FAIL.
      #
      # 110 -> 140 WITH BUILD IT 22 (issue #221), which extends the same script with
      # today's limit: the ask after the limit, five asks at once where two uses are
      # left, and a signed-out call still being refused at the door. Thirty cases.
      #
      # The one that matters feeds judgeRefusedAtLimit the answer a function that COUNTS
      # NOTHING gives -- 200 with suggestions, which is what staging answers before the
      # deploy -- and requires all four parts to come out FAIL. Six more are the
      # arithmetic the script's own drive-to-the-limit rests on: which answers spend one
      # of the day's uses, read off docs/plan.md's table, including `unreachable`, which
      # costs nothing and counts anyway. Getting one of those wrong in the generous
      # direction would make the script ask more times than it meant to, which costs
      # real money, so they are checked rather than trusted.
      #
      # THE STAGING RUN OF THAT SECTION NEEDS A FLAG and is not part of an ordinary run:
      # --ai-limit=<n> tells the script what limit the deployed function has, which it
      # cannot read. Without it the section reports UNVERIFIED and makes no asks. This
      # job passes no flag and makes no request of any kind: --selftest returns before a
      # setting is read.
      EXPECTED_AI_CASES: "140"
      # THE FIFTH ARRIVED WITH BUILD IT 23 (the coach's review of PR #241), which
      # asks for a staging script in this pull request so the bucket's rules are
      # proven on staging before they reach production. build-it-23-attachment-checks.mjs
      # is the script the owner runs before and after `supabase db push`, and its 97
      # cases are what make a green run from it mean something: they feed every
      # judgement an answer from a world where the migration was never applied -- no
      # bucket at all, a public bucket Bob can read and list, no type list so an SVG
      # is accepted, no size limit, no per-task limit, an UPDATE policy so a file can
      # be renamed into another task, and no trigger so a task deletes with its files
      # orphaned -- and require each one to come out FAIL.
      #
      # Six of the 97 are there because BREAKING THE CODE ON PURPOSE FOUND HOLES IN
      # THE SELFTEST ITSELF, which is the reason to count cases rather than trust an
      # exit code. Two exercise judgeUploadRefused with no stated expectation, because
      # deleting its "it was accepted" branch altogether left every other case green --
      # the branch was unreachable as the thing that decided. Four carry the bodies
      # staging REALLY sends, copied off a run rather than written from the
      # documentation: Storage answers HTTP 400 with a 404 inside it, which is what let
      # the headline judgement pass with no bucket at all.
      #
      # This job makes no request of any kind: --selftest returns before a setting is
      # read, so it needs no key, no account and no network, the same as the four
      # beside it. The staging run itself is NOT here and cannot be -- it needs the
      # staging URL and all three test accounts, and it uploads about 5 MB.
      #
      # 97 -> 105 -> 107 WITH BUILD IT 23 PART 2 (issue #242), which fixes the two
      # defects the owner's staging runs of 9 Oct 2026 found in the script itself.
      # Six of the ten new cases are HEIC, where ONE PROBE BECAME TWO CHECKS with
      # the expectation of the first REVERSED -- a `.heic` name with no content
      # type is refused, and the owner agreed to that change (AGENTS.md rule 20).
      # The other four are the leak check: section 15 reported a signed link in a
      # kept body when none had been printed, because a scrub applied when an
      # answer arrives cannot catch a credential born in that answer. One of the
      # four reproduces the old order and requires FAIL; the rest drive
      # readStorageAnswer, which is the one place the order now lives -- remove
      # the registration from it and two of them go red, which was seen.
      EXPECTED_ATTACHMENT_CASES: "107"
      # THE SIXTH ARRIVED WITH BUILD IT 25 PART 1 (issue #284), which asks for
      # it here by name. scripts/staging/build-it-25-captcha-checks.mjs is the
      # script the owner runs BEFORE and AFTER switching CAPTCHA on for staging,
      # and its 31 cases are what make either run mean something.
      #
      # THE ONE THAT MATTERS feeds judgeNoToken the answer a project with CAPTCHA
      # switched on BUT NOT CHECKED gives -- HTTP 200 and a session, for a
      # sign-in carrying no token at all -- and requires FAIL. That is the world
      # docs/rate-limits.md names as the one that would make the whole feature
      # protect nothing, and it is a thing no page read says either way.
      #
      # The rest: the dummy token refused, which is what a REAL secret key in
      # staging's settings would do and which breaks every automated sign-in in
      # this repository; thirty-one wrong-password sign-ins with no 429 anywhere,
      # which is the answer that would sink decision F; and a run that created an
      # account, asked for a reset email, or signed somebody out with
      # scope=global -- which would end the owner's own browser session.
      #
      # This job makes no request of any kind: --selftest returns before a
      # setting is read, so it needs no key, no account and no network, the same
      # as the seven beside it. The staging run itself is NOT here and cannot be:
      # it signs in as Alice and spends most of a five-minute rate-limit budget.
      EXPECTED_CAPTCHA_CASES: "31"

      # build-it-25-limits-checks: the 500-task cap and the control-character
      # constraints. Build it 25 part 2a.
      #
      # THE CASE THAT MATTERS MOST is the world where a single multi-row INSERT
      # walks past the cap: a batch of five accepted from one below it, leaving
      # 504. A local PostgreSQL 17.10 sandbox showed that is exactly what happens
      # if the counting function is marked `stable` rather than left volatile --
      # 600 rows from 499 all landed, reaching 1099 -- so it is not a
      # hypothetical, it is one word in the migration.
      #
      # The rest: the 501st task accepted, which is the world where the cap does
      # nothing; tasks_may_add() answering true for somebody who is actually at
      # the cap, which would make the screen tell them the wrong thing; a newline
      # still reaching a title; deleting a task NOT making room, which would make
      # the cap's own sentence advice that does not work; and a run that left
      # Alice at 500 -- which would refuse the three tasks
      # web/tests/access-rules.test.mjs creates as her on every pull request, and
      # turn somebody else's pull request red for a reason nobody could find.
      #
      # This job makes no request of any kind: --selftest returns before a
      # setting is read. The staging run itself is NOT here and cannot be -- it
      # fills a real account's list to five hundred rows and removes them again.
      EXPECTED_LIMITS_CASES: "48"

      # build-it-25-upload-count-checks: the daily count of attachment uploads.
      # Build it 25 part 2b.
      #
      # THE CASE THAT MATTERS MOST is not a refusal at all -- it is the three
      # worlds where the thirty-first upload IS refused and the body says
      # different things. Nobody knows what the Storage API makes of a trigger's
      # exception, so the judgement REPORTS the status and the body rather than
      # matching them, and three selftest cases feed it a refusal carrying both
      # the sentence and the SQLSTATE, one carrying only the sentence, and one
      # carrying neither. All three must come out usable, because the screen pull
      # request has to be written against whichever one staging turns out to be.
      #
      # The rest: the thirty-first ACCEPTED, which is the world where nothing is
      # counting; a refused upload that spent a slot anyway, which is the count
      # being written outside the row's transaction; deleting a file spending the
      # room it makes; tasks left behind, which the database would then refuse to
      # delete; and A PRINTED BODY CARRYING A LIVE TOKEN -- that last one matters
      # here and nowhere else, because this is the only check in this repository
      # that prints a whole response body on purpose.
      #
      # This job makes no request of any kind: --selftest returns before a setting
      # is read. The staging run itself is NOT here and cannot be -- it spends one
      # account's whole daily upload allowance, and nothing in this project can
      # give that back.
      #
      # 37 -> 45 ON 2026-10-12, after the staging run found two faults in this
      # script rather than in the migration. Eight new cases, and six of them
      # exist because of one mistake worth naming: THE OLD CHECK ACCEPTED ANY
      # REFUSAL as "the per-task limit refused it". Run after the daily limit was
      # reached, the thing refusing was the daily limit, so it passed for the wrong
      # reason and the check after it failed for a cause it named wrongly. That is
      # #174's "one status standing for more than one meaning", committed inside a
      # check.
      #
      # So the new cases include the body staging ACTUALLY returned -- HTTP 500,
      # {"statusCode":"500","error":"DatabaseError","message":"database error,
      # code: 54000",...} -- and require the per-task judgement to FAIL on it. Plus
      # the arithmetic that explains why a run of 30 uploads cleans up 28 files.
      EXPECTED_UPLOAD_COUNT_CASES: "45"

      # THE NINTH ARRIVED WITH BUILD IT 26 PART 1, AND THE OWNER ASKED FOR THIS
      # LINE BY NAME ON 2026-10-13 — which is what rule 5 requires: "Change
      # .github/workflows/ only when the owner asks, and never to skip or weaken
      # a check." This adds a check rather than weakening one, and it was filed
      # as #302 and left undone until the owner asked, rather than being slipped
      # in on the reasoning that adding is harmless.
      #
      # scripts/staging/build-it-26-legal-pages-checks.mjs is the before/after
      # the owner runs against a DEPLOYED build, and the one thing it answers
      # that nothing in this repository can: whether the Proxy actually lets a
      # SIGNED-OUT visitor reach /privacy and /terms. screen-state-check's
      # section 11 proves "/privacy" and "/terms" are in PUBLIC_PATHS; that list
      # is a module, and the thing that reads it runs in the Edge runtime on a
      # request. The failure it would otherwise hide is silent and total — a
      # privacy page that redirects to /login is a privacy page only people with
      # an account can read, which is the opposite of what #204 asks for.
      #
      # 17 -> 25 ON 2026-10-13, after the owner ran the script and IT MISREPORTED
      # WHAT IT FOUND. It said both paths were "redirected to /login" and pointed
      # at this app's PUBLIC_PATHS; what it had met was VERCEL'S DEPLOYMENT
      # PROTECTION, whose own page says it "requires authentication for all
      # requests, including those to Routing Middleware" — so this app's code had
      # not run at all. The script compared the final PATH and ignored the HOST,
      # and `/login` is the one string the two cases have in common.
      #
      # So eight cases arrived, and the two that matter are built from WHAT WAS
      # ACTUALLY OBSERVED — status 200, bodies of 334009 and 334001 bytes, a
      # redirect to /login — and they require more than a verdict: a FAIL with
      # the WRONG EXPLANATION is what happened, so each requires the right
      # sentence to be present and the blaming one to be absent.
      #
      # The rest are the six sentences docs/claims.md section 7 marks MUST NOT
      # SAY, each fed to the judgement on a page that says it; this app's own
      # /login redirect, which must still point at PUBLIC_PATHS; and an unfilled
      # [COMPANY NUMBER] placeholder reaching a page.
      #
      # IT MAKES NO REQUEST HERE. --selftest returns before the argument is read,
      # so there is no address, no network and no account involved — the same as
      # the eight above it. Its real run needs one public web address and no
      # secret of any kind, because the script has none.
      EXPECTED_LEGAL_PAGES_CASES: "25"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Run all nine self-tests, and count the cases each one ran
        run: |
          set -euo pipefail

          # Each case the selftest runs prints a line beginning "  ok" (or
          # "  WRONG", which makes the script exit non-zero by itself). We
          # count the cases rather than trusting the exit code, because a
          # selftest with its case list emptied would also exit 0.
          run_and_count () {
            label="$1"; script="$2"; expected="$3"
            log="$RUNNER_TEMP/$label.log"
            echo "--- $label: node $script --selftest"
            node "$script" --selftest | tee "$log"
            count=$(grep -c '^  ok  ' "$log" || true)
            : "${count:=0}"
            echo "$label: counted $count cases; at least $expected expected."
            if [ "$count" -lt "$expected" ]; then
              echo "::error::$label ran $count cases, fewer than the $expected expected. A selftest that has stopped running its cases cannot tell you the checks can still fail."
              exit 1
            fi
          }

          # Labels are the scripts' own file names, as in pure-checks above.
          run_and_count build-it-16-checks                 scripts/staging/build-it-16-checks.mjs                 "$EXPECTED_BUILD_IT_16_CASES"
          run_and_count build-it-16-suspend-checks         scripts/staging/build-it-16-suspend-checks.mjs         "$EXPECTED_SUSPEND_CASES"
          run_and_count build-it-18-invitation-status-checks scripts/staging/build-it-18-invitation-status-checks.mjs "$EXPECTED_INVITATION_STATUS_CASES"
          run_and_count build-it-20-ai-checks                scripts/staging/build-it-20-ai-checks.mjs                "$EXPECTED_AI_CASES"
          run_and_count build-it-23-attachment-checks        scripts/staging/build-it-23-attachment-checks.mjs        "$EXPECTED_ATTACHMENT_CASES"
          run_and_count build-it-25-captcha-checks           scripts/staging/build-it-25-captcha-checks.mjs           "$EXPECTED_CAPTCHA_CASES"
          run_and_count build-it-25-limits-checks            scripts/staging/build-it-25-limits-checks.mjs            "$EXPECTED_LIMITS_CASES"
          run_and_count build-it-25-upload-count-checks      scripts/staging/build-it-25-upload-count-checks.mjs      "$EXPECTED_UPLOAD_COUNT_CASES"
          run_and_count build-it-26-legal-pages-checks       scripts/staging/build-it-26-legal-pages-checks.mjs       "$EXPECTED_LEGAL_PAGES_CASES"

  # NO LIVE STRIPE KEY ANYWHERE IN THIS REPOSITORY -- Build it 27, Lesson O9, and
  # the owner's authorisation of 2026-10-14 for this workflow change (rule 5).
  #
  # WHY A SEPARATE JOB RATHER THAN A LINE IN THE GITLEAKS ONE. gitleaks reads the
  # git HISTORY and has its own rule set; this reads the WORKING TREE for two exact
  # strings the owner named. They catch different things and neither replaces the
  # other -- the same argument the bundle scan already makes about itself: "gitleaks
  # 8.30.1 has no rule for the sb_secret_ shape, so it would not catch this even in
  # source."
  #
  # ONLY THE TWO LIVE SHAPES, AND DELIBERATELY NOT pk_live_. A publishable key is
  # public by design -- it travels in the browser like the Supabase publishable key,
  # the Sentry DSN and the Turnstile site key -- so failing on it would be failing on
  # something that is not a secret, and a check that cries wolf is a check somebody
  # turns off. What `sk_live_` and `rk_live_` have in common is that either one in a
  # public repository is money somebody else can spend.
  #
  # IT MUST NOT MATCH ITSELF. The patterns are built from fragments at run time, so
  # the literal strings never appear in this file -- otherwise this job would fail on
  # its own source, which is the oldest joke in secret scanning and a real way to end
  # up with the check deleted.
  stripe-live-keys:
    name: No live Stripe key in the repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fail if a live Stripe key appears
        run: |
          set -uo pipefail

          # IT MATCHES A KEY, NOT A MENTION, and that distinction was found by
          # writing the first version of this check and running it: a bare search
          # for the two prefixes matched this workflow's own comments, two
          # sentences in docs/, and -- the one that proves the point --
          # scripts/scan-history.mjs, whose job is to look for the very same
          # thing. A check that cannot tell a leaked key from a document
          # discussing leaked keys is a check that gets switched off in a week.
          #
          # So the pattern is the SHAPE: the prefix followed by at least ten key
          # characters. The same floor scripts/scan-history.mjs already uses for
          # this key, chosen there for the same reason. A real Stripe key is far
          # longer than ten; prose that writes the bare prefix has nothing after
          # it, and a regex that writes the character class has punctuation.
          #
          # Built from pieces so this file does not contain what it forbids --
          # otherwise the job fails on its own source, which is the oldest joke
          # in secret scanning and a real way to end up with the check deleted.
          live="_live_"
          pattern="(sk|rk)${live}[0-9A-Za-z]{10,}"

          # --exclude-dir .git, because a packed object can contain anything and is
          # not a file anybody edits; gitleaks is what reads history.
          # grep exit codes: 0 found, 1 not found, 2 grep itself failed. "Not found"
          # is what we want, so 1 must not fail the step and 2 must never be mistaken
          # for it -- the same explicit handling the bundle scan uses.
          status=0
          grep -rIEn --exclude-dir=.git "$pattern" . || status=$?

          if [ "$status" = "0" ]; then
            echo "FAIL: a live Stripe key appears in the working tree, at the line(s) above."
            echo "A live key in a public repository is money somebody else can spend."
            echo "Remove it, then ROTATE it in Stripe -- deleting it in a later commit does not un-leak it."
            exit 1
          fi

          if [ "$status" -gt 1 ]; then
            echo "FAIL: grep itself failed (exit ${status}); this check did not run."
            exit 1
          fi

          echo "PASS: no live Stripe key in the working tree."

      # CAN THIS CHECK FAIL? Asked here rather than assumed, because a secret
      # scan that silently matches nothing is indistinguishable from a clean
      # repository -- and this one was rewritten once already, which is exactly
      # when a pattern stops matching by accident.
      - name: And prove the pattern catches one
        run: |
          set -uo pipefail
          live="_live_"
          pattern="(sk|rk)${live}[0-9A-Za-z]{10,}"

          planted="$RUNNER_TEMP/planted.txt"
          printf 'rk%sAbCdEf0123456789xyz\n' "$live" > "$planted"

          if grep -qE "$pattern" "$planted"; then
            echo "PASS: the pattern matches a planted live key."
            rm -f "$planted"
          else
            echo "FAIL: the pattern did NOT match a planted live key, so the check above proves nothing."
            rm -f "$planted"
            exit 1
          fi

  # The Deno tests over the four Edge Functions: issues #136, #167 and #183. They
  # are the only thing that proves the suspended-account check fails CLOSED when the
  # account_status read errors, the only thing that notices if one of the
  # four copies of checkSuspension drifts from the others, the only thing
  # that proves invite-member never answers "sent" over a row that says otherwise,
  # and -- since Build it 20 -- the only thing that proves what suggest-subtasks
  # actually sends to Anthropic, and that it refuses a reply claiming to have added
  # anything. Until this job there was no Deno step anywhere in this repository.
  #
  # IT NAMES THE FOLDER, NOT A FILE, and that is issue #167's fix. This job used
  # to name `supabase/functions/_tests/suspension_test.ts` by path, so the second
  # test file added to that folder -- invitation_status_test.ts, 62 tests over
  # Build it 18's invitation status -- ran nowhere at all and could not fail a
  # pull request. `deno test <dir>` picks up every file matching its test naming
  # convention, so a third file is covered the day it is written rather than the
  # day somebody remembers this line.
  #
  # Deno is installed from its own release with the download checksum-verified,
  # the same way the gitleaks CLI is installed above, rather than through a
  # third-party setup action: that would be a new dependency, and AGENTS.md
  # rule 17 says the owner approves one of those before it is added, not after.
  #
  # Dependabot does NOT update these two lines. To upgrade: pick a release at
  # https://github.com/denoland/deno/releases and copy the version and the
  # number out of that release's deno-x86_64-unknown-linux-gnu.zip.sha256sum.
  #
  # This job does reach the network -- Deno fetches the two module imports from
  # jsr.io and npm. It reaches no Supabase project: nothing here has a URL, a
  # key or an account, staging or production.
  functions-test:
    name: Edge function tests (Deno)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      DENO_VERSION: "2.9.7"
      DENO_SHA256: "c6527f24f4b16031d3ae4fa9f658d5f11534c8d84ce7dc8502420280919c3490"
      # So the summary line can be read without ANSI colour codes in the way.
      NO_COLOR: "1"
      # Counted from the test run's own summary; a floor, as above. 40 from
      # suspension_test.ts, 62 from invitation_status_test.ts and 90 from
      # suggest_subtasks_test.ts, measured by running the folder:
      # "ok | 192 passed | 0 failed".
      #
      # THE THIRD FILE ARRIVED WITH BUILD IT 20 (issue #183) and needed no change
      # to the step below, because that step names the FOLDER rather than a file --
      # which is exactly what issue #167 changed it to do, and the first time that
      # decision has paid for itself. Only this number moved, from 102.
      #
      # 187 -> 192 with the coach's review of PR #190: five tests, for the two
      # things it asked for. Three say a 404 from the AI service is
      # `model_unavailable` rather than `refused`; two say the 15-second timer
      # covers the BODY of a reply and not only its headers -- and one of those two
      # is the over-correction guard, because a fix that aborted everything would
      # pass the other.
      #
      # 192 -> 213 with Build it 21 (issue #211): twenty-one tests over the consent
      # check. Fourteen are what checkAiConsent decides for on, off, no profile row
      # and every way a read can fail to answer -- four of those fourteen are the
      # truthy shapes a boolean column read back as text arrives in, where the string
      # "false" must not be read as consent. Two are the OFF refusal's own body and
      # the fact that its code is deliberately NOT one of the twelve fixed-failure
      # codes. Four are withConsent, the gate the handler itself calls, handed the
      # rest of the handler as `proceed`: with the setting off, no profile row, or an
      # unreadable setting, the task is NEVER read and a stubbed AI service receives
      # NOTHING -- and with it on, `proceed` runs exactly once. The last is the
      # can-this-fail guard for a gate that reads the setting with a truthy test.
      #
      # 213 -> 250 WITH BUILD IT 22 (issue #221), and the FOURTH FILE in that folder
      # arrived with it: supabase/functions/_tests/daily_limit_test.ts, 37 tests over
      # the daily limits. It needed no change to the step below, because that step
      # names the FOLDER rather than a file -- the second time issue #167's decision
      # has paid for itself.
      #
      # What the 37 are: three over the config (both numbers are 20, the feature words
      # are the ones the migration's check constraint allows, and NEITHER function
      # spells a limit at a call site); seventeen over countOneUse, which include every
      # truthy shape a boolean read back as text arrives in and both raises the coach
      # measured in a sandbox on PR #224; four over the refusal's own sentence, status
      # and two codes, including that the LIMIT code is deliberately not one of the
      # thirteen fixed-failure codes while the COUNTER-ERROR code is; one that limits.ts
      # exports no way to give a counted use back; eight over the gate itself across
      # BOTH functions -- at the limit and on a counter error, the stubbed AI service
      # and the stubbed email service receive NOTHING and `proceed` never runs, and
      # under the limit it runs exactly once and its answer comes back untouched; and
      # four can-this-fail guards, which feed the same assertions a gate that counts and
      # carries on, a gate that counts AFTER the paid call, a gate that reads an error as
      # permission, and the world issue #221 names by name -- a count that always says
      # yes -- and require each one to come out RED.
      #
      # THE ONE TEST IN AN EXISTING FILE THAT CHANGED is suggest_subtasks_test.ts's
      # count of SUGGEST_CODES, from 12 to 13, because `daily_limit_unknown` was added
      # to that list. That test says in its own words that raising the number is the only
      # thing a new code may do to it, and the two assertions that matter -- one sentence
      # and one status across every code in the list -- are untouched. The pull request
      # has its own line about it.
      #
      # 250 -> 278 with Build it 26 (delete-account), and 278 -> 297 WITH BUILD IT
      # 27 (issue for the Team plan): nineteen tests in a FIFTH file,
      # supabase/functions/_tests/stripe_test.ts. It needed no change to the step
      # below, because that step names the FOLDER.
      #
      # What the 19 are: ten over the key check of Lesson O9 -- a live key outside
      # production and a test key inside it are both refused, the matching pairs are
      # allowed, a missing key is its own reason, a key whose mode cannot be read is
      # refused because an unknown is not a yes, and only the exact word "production"
      # counts as production; two of those ten are the gate itself, which with a
      # mismatched key never runs the handler at all and with a matching one runs it
      # exactly once, which is the same negative-and-its-over-correction pair every
      # other gate in this folder is tested with. ONE OF THEM IS A RULE 18 TEST: the
      # refusal's log line must contain the setting's name and the two mode words and
      # must NOT contain the key, its body or its tail.
      #
      # Five are what a Stripe subscription becomes: active and trialing entitle,
      # past_due / unpaid / canceled / incomplete / paused do not but keep their
      # status so a lapse can be told from a cancellation, a subscription with no
      # user_id in its metadata produces NO ROW rather than one belonging to nobody,
      # a null period end stays null, and the period end is read as SECONDS -- a
      # factor of 1000 there would put every expiry in 1970 and silently take away
      # what somebody paid for.
      #
      # Four are the book's "cancellation arriving before the sign-up": the point of
      # the design is that order cannot produce a wrong answer, because nothing reads
      # a status out of an event -- both events prompt the same question to Stripe and
      # Stripe's answer is what is written. So the test is that either event, given
      # the same current subscription, produces the identical row; plus that the
      # access-event list is fixed and carries the cancellation, and that the two
      # entitling statuses are the same pair the migration's team_member_limit()
      # spells.
      EXPECTED_FUNCTION_TESTS: "297"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download Deno and verify its checksum
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/deno.zip" \
            "https://github.com/denoland/deno/releases/download/v${DENO_VERSION}/deno-x86_64-unknown-linux-gnu.zip"
          echo "${DENO_SHA256}  $RUNNER_TEMP/deno.zip" | sha256sum --check --strict
          unzip -q -o "$RUNNER_TEMP/deno.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/deno" --version
      - name: Every Deno test beside the functions (suspension, invitation status, suggest subtasks, daily limits)
        # --allow-read is narrowed to TWO named directories and nothing else, and both
        # hold only code that is committed to this repository.
        #
        #   supabase/migrations   invitation_status_test.ts reads
        #                         20261006095847_invitation_status.sql and
        #                         daily_limit_test.ts reads
        #                         20261008115900_usage_counts.sql, so each fixed list in
        #                         TypeScript is compared with the check constraint that
        #                         enforces it rather than with a second copy of itself.
        #   supabase/functions    ADDED WITH BUILD IT 22 (issue #221). One test reads the
        #                         two handlers' own source, because "neither function
        #                         spells a limit at a call site" is an ABSENCE and there
        #                         is no value to pass in that would reveal a stray 20
        #                         sitting in a file. docs/plan.md's "one config file"
        #                         decision is what that test holds.
        #
        # IT IS A WIDENING THAT ENABLES A CHECK, never one that skips or weakens one, and
        # the pull request calls it out on its own line. The run still cannot read a key,
        # a .env file, supabase/.temp or anything else on the disk -- which is why it was
        # widened by a named directory rather than to the parent.
        #
        # --config names create-team's deno.json because the repository root has
        # none and the bare specifiers would not resolve; the three function
        # folders' copies are character-for-character identical, so any one of them
        # resolves the imports for every test here.
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/deno" test --no-lock --allow-env \
            --allow-read=supabase/migrations,supabase/functions \
            --config supabase/functions/create-team/deno.json \
            supabase/functions/_tests | tee "$RUNNER_TEMP/deno-test.log"

          # Read the count out of Deno's own summary line, which with NO_COLOR
          # reads: "ok | 102 passed | 0 failed (270ms)". A test file whose tests
          # had all been deleted would still exit 0, so the number is checked.
          passed=$(sed -n 's/^ok | \([0-9][0-9]*\) passed .*/\1/p' "$RUNNER_TEMP/deno-test.log")
          : "${passed:=0}"
          echo "Counted $passed passing tests; at least $EXPECTED_FUNCTION_TESTS expected."
          if [ "$passed" -lt "$EXPECTED_FUNCTION_TESTS" ]; then
            echo "::error::Only $passed tests passed, fewer than the $EXPECTED_FUNCTION_TESTS expected. Either tests were removed or none ran -- that is a failure, not a pass."
            exit 1
          fi

  # THE NIGHTLY COPY, RUN END TO END WITH NO REAL DATA: issue #258, Build it 24
  # part 1. The thing .github/workflows/backup-production.yml does every night
  # against production is done here against a throwaway PostgreSQL seeded with
  # made-up accounts, tasks and storage records, and a stand-in for both object
  # stores -- back up, encrypt, upload, verify, download, decrypt, restore,
  # compare.
  #
  # WHY IT IS WORTH A JOB OF ITS OWN. A backup is the one piece of code whose
  # failure is invisible until the day it matters, and whose success cannot be
  # checked by looking at production (rules 1 and 10 forbid it, and nobody
  # should be restoring production to find out). So the only honest place to
  # exercise it is a world made of made-up data, and the only honest time is
  # every pull request.
  #
  # AND IT IS SEEN TO FAIL. The five things issue #258 names each have a case
  # that must come out FAIL before the run is allowed to pass: the accounts
  # left out of the dump, a file missing from the copy, the copy uploaded
  # unencrypted, the wrong passphrase, and a secret or a row appearing in the
  # log. Those are the lines beginning "PASS  SEEN TO FAIL:".
  #
  # NO CREDENTIAL OF ANY KIND. Every setting the scripts read is a made-up
  # value invented in scripts/backup/proof.mjs, pointing at 127.0.0.1. This job
  # names no environment, holds no secret, and reaches no Supabase project,
  # staging or production. It cannot: the script refuses a database URL whose
  # host is not this machine.
  #
  # ubuntu-24.04 RATHER THAN ubuntu-latest, because this job and the nightly
  # one must run on the same image for the versions below to mean anything.
  #
  # AND IT USES POSTGRESQL 17, NOT THE IMAGE'S OWN 16. The image carries 16.15
  # (its README, read 2026-10-10) and **production is PostgreSQL 17.6** -- the
  # coach's read through the production read-only connector on that date. So
  # this job installs the 17 client AND a 17 server with the very same script
  # the nightly job uses, `scripts/backup/install-pg17.sh`. That is the coach's
  # requirement from the review of PR #265, and the reason is sharp: against a
  # 16 server, the "seen to fail with a 16 client" case below would pass for
  # the wrong reason, because a 16 client against a 16 server is fine.
  backup-proof:
    name: Nightly copy, end to end on made-up data (backup, encrypt, restore, compare)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # A FLOOR, not an equality, as the counting jobs above. Counted from the
      # script's own output on 2026-10-10:
      # evidence/build-it-24-nightly-copy.md has the runs.
      #
      # 114 -> 127 AFTER THE COACH'S REVIEW OF PR #265, which answered #262:
      # production is PostgreSQL 17.6, so the client has to be 17 and the proof
      # has to run against a 17 server. Thirteen checks: eight over the
      # version judgement itself (including the real 16-against-17 pair that
      # would have stopped the first run), two that assert this job's own
      # premise -- that the server really is major 17 and the client matches it
      # -- and three that run the refusal END TO END with the image's own
      # 16.15 binary.
      #
      # THOSE LAST THREE ARE WHY THIS NUMBER IS 3 HIGHER THAN A LOCAL RUN'S. On
      # a machine with only one PostgreSQL the script prints UNVERIFIED for
      # them and counts nothing, which is what a local run on Windows does.
      # Here the 16 client is on the image, so they run -- and this floor is
      # what makes them run, because the job goes red if they are skipped.
      #
      # 159 -> 196 AFTER THE OWNER'S FIRST RESTORE DRILL, 10 Oct 2026, which
      # stopped at `PUT answered HTTP 415, code InvalidMimeType` because the
      # restore sent every file with no type the bucket accepts. Thirty-seven
      # checks: where a file's content type comes from and what happens when it
      # comes from nowhere, reading a type out of the dump's storage records,
      # classifying psql's errors by kind instead of counting them, the restore
      # of a copy made BEFORE types were recorded (which is both of today's),
      # running the whole restore a second time over the same project, and the
      # drill's own 415 reproduced -- which CI could not do until the stand-in
      # was given the bucket's six types.
      #
      # 127 -> 159 AFTER THE FIRST REAL RUN WAS REFUSED, 10 Oct 2026. The
      # upload answered 403 and the log said only that, so: eleven checks
      # against AWS's OWN published Signature Version 4 test vectors (#261 --
      # one of which found a real bug in this signer), nine over what
      # Cloudflare documents for R2 and what this actually sends, nine over
      # reading the S3 error code and refusing to repeat anything else from a
      # response, and three over the preflight that now asks the backup bucket
      # whether it may write BEFORE production is read at all.
      #
      # 196 -> 268 AFTER THE OWNER'S FIRST FINISHED RESTORE DRILL, 10-11 Oct
      # 2026 (evidence/restore-tested.md). Seventy-two checks, and the first
      # group is the one that matters most:
      #
      #   * A ROW OF DATA EXECUTED AS SQL, reproduced against a real psql and
      #     then made impossible. Three of the drill's 574 ERROR lines were
      #     syntax errors at character 1, which is a table's rows being parsed
      #     as SQL after a COPY was refused. The case runs the old shape and
      #     requires the row's own first column to come back inside the error,
      #     then runs the new shape and requires no sign of it. It also found a
      #     second error nobody had noticed -- `invalid command \.` -- and
      #     PostgreSQL's `\restrict` hardening, which is why the replay is two
      #     passes.
      #   * WHAT A RESTORE PROMISES, by name: every table in public, the
      #     accounts, the storage records and the files. A mismatch inside the
      #     promise fails; everything else is reported with a count and never
      #     fails. The made-up world now holds a child table whose name sorts
      #     before its parent's, so the retry round that repairs pg_dump's
      #     alphabetical data order is a tested path and not machinery nobody
      #     has run.
      #   * THE FIVE MANAGED-SCHEMA AND SESSION REFUSALS the drill named, each
      #     now its own expected kind -- and the three syntax errors still
      #     unexpected, deliberately.
      #   * THE FRESHNESS WATCHER (#264), end to end against the stand-in R2
      #     with no passphrase anywhere in its environment: a fresh bucket, a
      #     three-day-old copy, an EMPTY bucket, and a bucket it cannot read.
      #
      # WHY 265 AND NOT 268, AND THE ANSWER IS MEASURED RATHER THAN CHOSEN.
      # Three of the new checks reproduce the drill's fault against a real psql
      # -- a refused COPY's rows being read as SQL -- and **not every psql does
      # it**. Measured 2026-10-11:
      #
      #   psql 17.10 (EDB, Windows)  -> reproduces it: 3 ERROR lines
      #   psql 17.11 (pgdg, Ubuntu)  -> does NOT: 1 ERROR line
      #   psql 16.15 (pgdg, Ubuntu)  -> does NOT: 1 ERROR line
      #
      # Both clients on this image swallow the rows, so the case says UNVERIFIED
      # here and counts nothing; it runs on the owner's own machine, which is
      # the client the owner actually restores with. **Why they differ is not
      # established** and it is not "newer is fixed", because 16.15 is older
      # than 17.10 and behaves like 17.11. So this floor is 265 on both: this
      # job's three "client too old" checks make up the difference the other
      # way. Raising it to 268 would turn the runner red for a reason that has
      # nothing to do with the backup.
      EXPECTED_BACKUP_CHECKS: "265"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      # THE SAME SCRIPT THE NIGHTLY JOB RUNS, with --with-server so this one
      # gets a version 17 SERVER as well as the version 17 client. That is the
      # coach's requirement from the review of PR #265, and the reason for it
      # is exact: production is PostgreSQL 17.6, and a proof run against the
      # image's own 16 server would exercise a pair of versions the nightly job
      # will never see -- and would make the "seen to fail with a 16 client"
      # case pass for the wrong reason, because a 16 client against a 16 server
      # is fine. One script, so the proof and the job cannot drift apart.
      - name: Install the PostgreSQL 17 client and server, pinned and verified
        run: sh scripts/backup/install-pg17.sh --with-server
      - name: Create and start the version 17 cluster, and read its port rather than guess it
        run: |
          set -euo pipefail
          # THE CLUSTER IS CREATED EXPLICITLY, and the first version of this
          # step did not do that and failed: installing `postgresql-17` on this
          # image creates NO cluster. `pg_lsclusters` listed only "16 main",
          # and `pg_ctlcluster 17 main start` answered "specified cluster '17
          # main' does not exist" -- the runner image turns the automatic
          # creation off, which is the same reason its own 16 server is `down`
          # until a job starts it. So the cluster is made here rather than
          # hoped for, and the step is idempotent so a re-run is harmless.
          if ! pg_lsclusters -h | awk '$1 == "17" && $2 == "main" { found = 1 } END { exit !found }'; then
            sudo pg_createcluster 17 main --start
          fi
          sudo pg_ctlcluster 17 main start || true
          pg_lsclusters
          # The PORT depends on what the image already had configured: 5432
          # belongs to the image's own 16 cluster, so 17/main lands on 5433.
          # It is READ rather than assumed, because a wrong guess here would
          # point the proof at the 16 server and quietly prove the wrong thing.
          port="$(pg_lsclusters -h | awk '$1 == "17" && $2 == "main" { print $3 }')"
          if [ -z "$port" ]; then
            echo "::error::No PostgreSQL 17 cluster is configured, so the nightly copy could not be exercised against the version production runs. That is UNVERIFIED, not a pass (AGENTS.md rule 8)."
            exit 1
          fi
          # The runner user is not `postgres`, and Ubuntu's default pg_hba uses
          # peer authentication for local connections -- so a password is set
          # for the loopback connection the proof makes. It is the word
          # "postgres", in a throwaway cluster, on a machine that is destroyed
          # when this job ends; it is not a secret and is deliberately written
          # in the open, like the placeholder settings in app-build above.
          sudo -u postgres "$BACKUP_PSQL" --port "$port" -c "ALTER USER postgres PASSWORD 'postgres'"
          echo "BACKUP_PROOF_DB_URL=postgresql://postgres:postgres@127.0.0.1:$port/postgres" >> "$GITHUB_ENV"
          "$BACKUP_PSQL" --version
          openssl version
      - name: Back up, encrypt, upload, verify, download, decrypt, restore, compare
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/backup-proof.log"
          node scripts/backup/proof.mjs | tee "$log"
          count=$(grep -c '^PASS ' "$log" || true)
          : "${count:=0}"
          echo "backup-proof: counted $count PASS lines; at least $EXPECTED_BACKUP_CHECKS expected."
          if [ "$count" -lt "$EXPECTED_BACKUP_CHECKS" ]; then
            echo "::error::backup-proof ran $count checks, fewer than the $EXPECTED_BACKUP_CHECKS expected. Either the script lost checks or the end-to-end half did not run -- and a backup nobody exercised is a belief about a backup. Restore them, or lower the expected number on purpose and say why."
            exit 1
          fi

  # The full test suite on Windows and macOS. The jobs above run on Linux.
  # This caught (and now guards against) path bugs that only show up off Linux.
  other-os:
    name: npm test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: npm test
        run: npm test

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    # We run the free, open-source gitleaks COMMAND-LINE tool directly instead
    # of gitleaks/gitleaks-action, because that action needs a licence key
    # (GITLEAKS_LICENSE) for repositories owned by an organization account.
    # The CLI needs no key, for anyone.
    #
    # Dependabot does NOT update these two lines. To upgrade: pick a release
    # at https://github.com/gitleaks/gitleaks/releases and copy the new version
    # and the linux_x64 line from that release's gitleaks_<version>_checksums.txt.
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # full history: a secret deleted later is still leaked
          persist-credentials: false
      - name: Download gitleaks and verify its checksum
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
      - name: Scan the whole git history for secrets
        # --redact keeps any secret it finds OUT of the public log.
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose --exit-code 1 .

  # The web app itself: install exactly what the lockfile says, lint, build.
  # The jobs above test the kit's own scripts; this one tests the product.
  app-build:
    name: App build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    # The build reads these names, so they have to exist. They do NOT have to be
    # real: nothing here connects to Supabase or to Sentry, it only compiles.
    # These are obvious placeholders written in the open on purpose -- no secret
    # belongs in this file, and all three values are public ones in any case.
    #
    # The third arrived with Build it 18 (issue #157). Two things about it:
    #
    #   * It is NOT what makes this job pass. web/src/lib/env.ts only insists on
    #     a DSN when VERCEL_ENV is "production" or "preview", and GitHub Actions
    #     sets no VERCEL_ENV, so this build would succeed without it. It is here
    #     so that the build COMPILES the Sentry code path with a value present,
    #     rather than only ever compiling the empty-DSN branch.
    #   * It is shaped like a real DSN but points at a host that does not exist,
    #     so if anything in the build did try to send a report it would fail at
    #     DNS rather than reach anybody's project.
    #   * The FOURTH arrived with Build it 25 part 1 (issue #284), and it is the
    #     one value on this list that is not a placeholder at all: it is
    #     Cloudflare's own published dummy sitekey, which "Always passes" with a
    #     visible widget
    #     (https://developers.cloudflare.com/turnstile/troubleshooting/testing/).
    #     Like the DSN above it is NOT what makes this job pass --
    #     web/src/lib/env.ts only insists on a site key when VERCEL_ENV is
    #     "production" or "preview", and GitHub Actions sets no VERCEL_ENV -- it
    #     is here so the build COMPILES the widget's code path with a key
    #     present rather than only ever compiling the empty-key branch. It is
    #     not a secret: Cloudflare publishes it, and
    #     scripts/auth-screens-check.mjs requires this line to carry the same
    #     value the app's own TURNSTILE_DUMMY_SITE_KEY holds.
    env:
      NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "placeholder-key"
      NEXT_PUBLIC_SENTRY_DSN: "https://placeholder@placeholder.ingest.sentry.io/0"
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: "1x00000000000000000000AA"
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install exactly what the lockfile says
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      # Everything under web/.next/static is PUBLIC: Next.js serves it to every
      # browser that opens the app. A publishable key belongs there. A secret key
      # never does, and once one has been served it is leaked -- the only real fix
      # is to rotate it. So the build is not finished until we have looked.
      #
      # This is not covered by the "Secret scan (gitleaks)" job above. That job
      # reads the git history; this one reads the compiled output, where a key can
      # arrive without ever being written in a source file -- inlined from an env
      # var at build time, for instance. Confirmed on 2026-09-29: gitleaks 8.30.1
      # has no rule for the "sb_secret_" shape, so it would not catch this even in
      # source. See evidence/bundle-scan.md.
      - name: No Supabase secret key in the built bundle
        run: |
          # grep exit codes: 0 = found a match, 1 = found nothing, 2 = grep itself
          # failed. "Found nothing" is the result we want, so 1 must not fail this
          # step -- and 2 must never be mistaken for it. Hence the explicit status
          # check rather than a bare "grep || true", which would hide a real error.
          set -uo pipefail

          # A check that silently had nothing to look at is not a pass (AGENTS.md
          # rule 8). If the directory is missing or empty, something is wrong with
          # the build, and this step says so instead of reporting success.
          if [ ! -d .next/static ]; then
            echo "::error::web/.next/static does not exist, so NOTHING was scanned. Did the build step run?"
            exit 1
          fi
          count=$(find .next/static -type f | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error::web/.next/static contains no files, so NOTHING was scanned."
            exit 1
          fi
          echo "Scanning $count files under web/.next/static for sb_secret_ or service_role."

          # -r recursive, -a treat every file as text so nothing is skipped for
          # looking binary, -n line numbers, -o print ONLY the matched token.
          # -o matters for safety: it prints the prefix and ONE character of
          # what follows, not the key, so a real leak cannot be copied out of
          # this public log.
          #
          # ONE CHARACTER AFTER THE PREFIX, AND THE OWNER AUTHORISED THAT CHANGE
          # ON 9 OCTOBER 2026 (Build it 23 part 2, issue #242). AGENTS.md rule 5
          # reserves every change to this folder to the owner and forbids any
          # that skips or weakens a check, so what it does and does not change is
          # written out here rather than left to a diff:
          #
          #   WHY IT HAD TO CHANGE. Build it 23 part 2 uploads a file from the
          #   browser, as the signed-in person, so that the INSERT policy on
          #   storage.objects is evaluated and the two counted limits in
          #   public.attachments_may_add() are reached -- issue #240 is the
          #   argument, and an upload made with the service-role key would be
          #   evaluated against no policy at all. That puts
          #   @supabase/supabase-js in the browser bundle for the first time,
          #   and THE LIBRARY ITSELF CONTAINS THE LITERAL: it ships
          #   `e.startsWith("sb_publishable_")||e.startsWith("sb_secret_")`, a
          #   test for which kind of key a string is. Seen on this branch: the
          #   build put it in .next/static/chunks and the old pattern matched it.
          #
          #   WHY THIS IS PRECISION AND NOT A WEAKENING. A key is the prefix
          #   FOLLOWED BY the key, so every real one -- inlined from an env var,
          #   written in a source file, pasted into a comment -- is still
          #   matched: `"sb_secret_AbC123..."` has a letter after the underscore.
          #   The library's literal is the prefix followed by a quote, which is
          #   not a key and never was. The set of real keys this catches is
          #   unchanged; the set of non-keys it catches is smaller by one.
          #
          #   WHAT IT COSTS, stated rather than discovered: a key of the prefix
          #   and NOTHING else would now pass. That is not a key, it is the
          #   prefix -- it grants nothing, because there is no secret in it.
          #
          #   `service_role` IS UNTOUCHED, and deliberately: that half has no
          #   false positive to fix, and the narrower the change the easier it is
          #   to agree with.
          set +e
          hits=$(grep -ranoE 'sb_secret_[A-Za-z0-9]|service_role' .next/static)
          status=$?
          set -e

          if [ "$status" -eq 2 ]; then
            echo "::error::grep failed, so the bundle was NOT checked. Treat this as a failure, not a pass."
            exit 1
          fi
          if [ "$status" -eq 0 ]; then
            echo "::error::A Supabase secret key shape was found in the built bundle. Everything under .next/static is served to browsers, so treat the key as leaked and rotate it -- see docs/secrets.md."
            echo "Where it was found (file:line:matched-token -- the key itself is not printed):"
            echo "$hits" | head -20
            exit 1
          fi
          echo "Clean: no sb_secret_ or service_role in any of the $count files."

  # The access-rule tests: issue #145, Build it 17. Both sides of every rule --
  # Alice and Carol can read her team's tasks and Bob cannot, Bob cannot touch
  # her personal task and she can, Carol cannot delete her team task and she
  # can, Bob cannot invite into her team and she can, and a signed-out caller
  # gets nothing from any table.
  #
  # THIS IS THE ONLY JOB IN THIS FILE THAT SIGNS IN TO A REAL PROJECT. It runs
  # against STAGING and nothing else: web/tests/staging.mjs parses
  # STAGING_SUPABASE_URL before any request and refuses unless the scheme is
  # https and the host is exactly the staging project's. A job pointed
  # elsewhere stops before its first network call.
  #
  # environment: staging, and ON THIS JOB ONLY. The five settings are
  # ENVIRONMENT secrets there, not repository secrets, for the reason
  # docs/environments.md gives about `supabase-production`: a repository secret
  # is readable by a workflow running on ANY branch, and a workflow file is
  # only a file in that branch -- so whoever can push a branch can push a job
  # that reads them. An environment secret is handed only to a job that names
  # that environment.
  #
  # IT NEVER PASSES BY SKIPPING. With no secrets -- a fork's pull request, or
  # Dependabot's, neither of which GitHub gives environment secrets to -- the
  # first step fails and names what is missing. A check that could not run is
  # not a pass (AGENTS.md rule 8).
  #
  # No npm ci: the tests use Node built-ins and global fetch only, so there is
  # nothing to install, and nothing in web/node_modules is on their path.
  app-tests:
    name: App tests (access rules on staging)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    environment: staging
    defaults:
      run:
        working-directory: web
    env:
      # A FLOOR, not an equality, as the two counting jobs above. Adding tests
      # must not fail this job; a run that tested FEWER things than it used to
      # has lost coverage, and a run that tested nothing is not a pass. The
      # number was counted from the test file's own TAP summary.
      # 25 -> 40 WITH BUILD IT 23 PART 2 (issue #242). Fifteen new tests over the
      # three policies on `storage.objects`, and NOT ONE existing test changed:
      # Alice attaches a file to her team task and it is listed back; Carol can
      # list it and open it byte for byte; Bob cannot list, open or delete it; a
      # signed-out stranger with the publishable key cannot do any of those
      # three; a file one byte over 5 MB is refused FOR ITS SIZE and an SVG FOR
      # ITS TYPE -- the code in the body, not the status, because Storage was seen
      # to wrap the real status inside it; the task cannot be deleted while the
      # file is on it, and deletes once it is gone.
      #
      # WHY HERE AND NOT ONLY IN THE HAND-RUN STAGING SCRIPT, which asks more of
      # the same bucket: that script is run by the owner before and after an
      # apply, and these run on every pull request. They are the only thing in
      # this repository that would notice a later change quietly opening the
      # bucket.
      #
      # One file of 70 bytes is stored and removed again; two more uploads are
      # attempted and refused on purpose, one of them 5 MB, which is nearly all of
      # what a run now sends. The after() hook removes files BEFORE tasks,
      # because the database refuses to delete a task that still has one.
      EXPECTED_APP_TESTS: "40"
      STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
      STAGING_ALICE_PASSWORD: ${{ secrets.STAGING_ALICE_PASSWORD }}
      STAGING_CAROL_PASSWORD: ${{ secrets.STAGING_CAROL_PASSWORD }}
      STAGING_BOB_PASSWORD: ${{ secrets.STAGING_BOB_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: All five settings must be present
        # Names only. No value is echoed, and GitHub masks secrets in logs
        # anyway -- this step relies on neither of those alone.
        run: |
          set -uo pipefail
          missing=""
          for name in STAGING_SUPABASE_URL STAGING_SUPABASE_PUBLISHABLE_KEY \
                      STAGING_ALICE_PASSWORD STAGING_CAROL_PASSWORD STAGING_BOB_PASSWORD; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::These settings are empty or absent:$missing. They are environment secrets of the 'staging' environment, which GitHub does not give to a pull request from a fork or to Dependabot. This job FAILS rather than skipping: a check that could not run is not a pass."
            exit 1
          fi
          echo "All five settings are present. No value is printed."
      - name: npm test, and count what actually passed
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/app-tests.log"
          status=0
          npm test | tee "$log" || status=$?

          # Node's TAP summary: "# pass 25", "# fail 0", "# skipped 0",
          # "# todo 0". The counts are read rather than trusted to the exit
          # code, because a file whose tests had all been deleted would also
          # exit 0.
          count () { sed -n "s/^# $1 \([0-9][0-9]*\)\$/\1/p" "$log" | tail -1; }
          passed=$(count pass);   : "${passed:=0}"
          failed=$(count fail);   : "${failed:=0}"
          skipped=$(count skipped); : "${skipped:=0}"
          todo=$(count todo);     : "${todo:=0}"

          echo "App tests: $passed passed, $failed failed, $skipped skipped, $todo todo; at least $EXPECTED_APP_TESTS expected to pass."

          if [ "$status" -ne 0 ]; then
            echo "::error::npm test exited $status. Read the lines above: a FAIL here is an access rule not doing what its migration says it does."
            exit 1
          fi
          if [ "$skipped" -ne 0 ] || [ "$todo" -ne 0 ]; then
            echo "::error::$skipped test(s) were skipped and $todo marked todo. A skipped access-rule test is not a pass (AGENTS.md rule 8)."
            exit 1
          fi
          if [ "$passed" -lt "$EXPECTED_APP_TESTS" ]; then
            echo "::error::Only $passed tests passed, fewer than the $EXPECTED_APP_TESTS expected. Either tests were removed or none ran -- that is a failure, not a pass. Restore them, or lower the expected number on purpose and say why."
            exit 1
          fi

  # ------------------------------------------------------------------------
  # required -- the ONE check to mark as required in your branch rules.
  #
  # Why this job exists: GitHub treats a SKIPPED job as passing. Its docs say
  # a skipped job reports "Success" and "will not prevent a pull request from
  # merging, even if it is a required check" (docs.github.com, "Using conditions
  # to control job execution").
  # A job can be skipped for many reasons -- a job it depends on failed, an
  # "if:" condition was false, or someone added a paths filter. If you
  # required each job directly, a skipped job could quietly let a PR merge.
  #
  # So this job:
  #   * uses "if: always()" so it runs even when others failed or were skipped
  #     (without it, it would itself be skipped -- and count as passing);
  #   * needs EVERY other job;
  #   * passes only if every needed job's result is exactly "success".
  #     "skipped", "failure" and "cancelled" all fail it. Skipped is NOT success.
  #
  # When you add a job above, add it to "needs" below AND bump EXPECTED_JOBS.
  # ------------------------------------------------------------------------
  required:
    name: required
    if: always()
    needs: [guard-selftest, skills-lint, launch-check-selftest, workflow-lint, vet-tool-selftest, handoff-selftest, drift-check-selftest, pure-checks, staging-script-selftests, functions-test, backup-proof, other-os, secret-scan, stripe-live-keys, app-build, app-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every needed job must have succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          # 14 -> 15 with Build it 24 part 1 (issue #258): backup-proof.
          # 15 -> 16 with Build it 27's stripe-live-keys job. The guard below
          # caught this being missed on PR #312, which is what it is for: the
          # job was added to `needs` and this number was not, so every job
          # succeeded and `required` still failed, naming the two lines to keep
          # in step. A green aggregator that silently stopped waiting for a job
          # is the failure it exists to prevent.
          EXPECTED_JOBS: "16"
        run: |
          set -euo pipefail
          echo "Result of every needed job:"
          echo "$NEEDS_JSON" | jq -r 'to_entries[] | "  \(.key): \(.value.result)"'
          count=$(echo "$NEEDS_JSON" | jq 'length')
          # Guard against checking nothing: zero jobs would otherwise "pass".
          if [ "$count" -ne "$EXPECTED_JOBS" ]; then
            echo "::error::Expected $EXPECTED_JOBS needed jobs but saw $count. Update needs and EXPECTED_JOBS together."
            exit 1
          fi
          bad=$(echo "$NEEDS_JSON" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")')
          if [ -n "$bad" ]; then
            echo "::error::These jobs did not succeed (skipped counts as NOT succeeded): $bad"
            exit 1
          fi
          echo "All $count jobs succeeded."
